<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo de Pizzas</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .pizza, .carrinho { border: 1px solid #ccc; padding: 10px; margin: 10px; border-radius: 5px; }
    .pizzas { display: flex; flex-wrap: wrap; gap: 10px; }
    .pizza img { max-width: 150px; display: block; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Catálogo de Pizzas</h1>
  <div class="pizzas" id="pizzas"></div>

  
    <div class="catalogo-grid">
      <div class="card pizza-card">
        <h3 class="pizza-name">Calabresa</h3>
        <p class="pizza-desc">Calabresa, cebola, mussarela e orégano</p>
        <p class="pizza-preco">R$ 45,00</p>
        <button class="btn btn-primary">Adicionar ao Carrinho</button>
      </div>
      
    </div>
  
    <h2>Carrinho</h2>
    <ul id="carrinho-lista" class="card"></ul>
    <button class="btn btn-success">Fechar Pedido</button>
  </div>
  <h2>Carrinho</h2>
  <div class="carrinho" id="carrinho"></div>
  <button onclick="fecharPedido()">Fechar Pedido</button>


  
  
  <script>
    let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

    function salvarCarrinho() {
      localStorage.setItem('carrinho', JSON.stringify(carrinho));
      renderizarCarrinho();
    }

    function adicionar(pizza) {
      const index = carrinho.findIndex(p => p.codigo === pizza.codigo);
      if (index !== -1) {
        carrinho[index].quantidade += 1;
      } else {
        carrinho.push({ ...pizza, quantidade: 1 });
      }
      salvarCarrinho();
    }

    function remover(index) {
      carrinho.splice(index, 1);
      salvarCarrinho();
    }

    function renderizarCarrinho() {
      const div = document.getElementById('carrinho');
      div.innerHTML = '';
      carrinho.forEach((p, i) => {
        const item = document.createElement('p');
        item.innerHTML = `${p.nome} (x${p.quantidade}) - R$ ${(p.preco * p.quantidade).toFixed(2)}
          <button onclick="remover(${i})">Remover</button>`;
        div.appendChild(item);
      });
    }

    function fecharPedido() {
      if (carrinho.length === 0) return alert('Carrinho vazio!');
      window.location.href = 'pedido.html';
    }

    async function carregarPizzas() {
      const res = await fetch('http://localhost:3000/pizzas/ativas');
      const pizzas = await res.json();
      const container = document.getElementById('pizzas');
      pizzas.forEach(p => {
        const div = document.createElement('div');
        div.className = 'pizza';
        div.innerHTML = `
          <h3>${p.nome}</h3>
          <img src="imagens/${p.imagem}" alt="${p.nome}" />
          <p>Ingredientes: ${p.ingredientes}</p>
          <p>Preço: R$ ${p.preco.toFixed(2)}</p>
          <button onclick='adicionar(${JSON.stringify(p)})'>Adicionar ao Carrinho</button>
        `;
        container.appendChild(div);
      });
    }

    carregarPizzas();
    renderizarCarrinho();
  </script>
</body>
</html>
